<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Access denied</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .card { max-width: 480px; padding: 40px; background: #1e293b; border: 1px solid #334155; border-radius: 12px; text-align: center; }
  h1 { color: #f8fafc; margin: 0 0 12px; font-size: 24px; }
  p { color: #94a3b8; line-height: 1.6; margin: 0 0 20px; }
  a { color: #60a5fa; text-decoration: none; font-weight: 600; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="card">
  <h1>Access denied</h1>
  <p>You're signed in, but your account doesn't have permission for this page. Admin-only pages need the <code>admin</code> role.</p>
  <p><a href="/">← Back to the dashboard</a> · <a href="/.auth/logout">Sign out</a></p>
</div>
</body>
</html>
